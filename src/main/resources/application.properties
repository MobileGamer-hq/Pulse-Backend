spring.application.name=PulseBackend
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=validate

# Flyway manages only the billing schema
spring.flyway.schemas=billing
spring.flyway.default-schema=billing
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# Flyway takes session-level locks, so use the session-mode port (5432), not 6543
spring.flyway.url=${MIGRATION_DB_URL}
spring.flyway.user=${DB_USER}
spring.flyway.password=${DB_PASSWORD}

# Keep Hibernate looking in billing too
spring.jpa.properties.hibernate.default_schema=billing

